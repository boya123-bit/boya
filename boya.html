<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伯亚小店</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f5f5f5;color:#222;padding-bottom:80px}
        .header{position:relative;background:#fff;padding:16px;text-align:center;border-bottom:1px solid #eee}
        .header h1{font-size:20px;font-weight:500}
        .domain{font-size:14px;color:#777;margin-top:4px}
        .back{position:absolute;left:14px;top:16px;font-size:24px;color:#333;cursor:pointer}
        .title-box{background:#fff;margin:12px;padding:20px;text-align:center}
        .title-box h2{font-size:32px;color:#32c832}
        .table-card{background:#fff;margin:12px;border-radius:4px;overflow:hidden}
        .table-head{display:flex;padding:14px 18px;color:#999;font-size:16px}
        .table-head div:first-child{width:65%}
        .table-head div:last-child{width:35%;text-align:right}
        .row-item{display:flex;align-items:center;padding:14px 18px;border-top:1px solid #eee;cursor:pointer}
        .row-item:hover{background:#f8f8f8}
        .goods-img{width:60px;height:60px;object-fit:cover;border-radius:4px;margin-right:12px}
        .row-text{font-size:18px;width:65%;display:flex;align-items:center}
        .row-money{font-size:18px;width:35%;text-align:right}
        .pay-way{background:#fff;margin:12px;padding:18px}
        .pay-title{color:#999;font-size:16px;margin-bottom:14px}
        .wechat-row{display:flex;align-items:center;font-size:18px;margin:8px 0;cursor:pointer}
        .tip-text{margin-top:20px;text-align:center;color:#999;font-size:15px;padding:0 10px}

        /*底部合计栏*/
        .total-bar{position:fixed;bottom:0;left:0;width:100%;background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee}
        .total-text{font-size:17px}
        .total-price{font-size:22px;color:#f44336;font-weight:bold}
        #payBtn{background:#32c832;color:#fff;border:none;font-size:17px;padding:10px 24px;border-radius:6px;cursor:pointer}
        #payBtn:active{background:#28b028}

        /*支付弹窗*/
        .mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999}
        .pay-modal{background:#fff;width:92%;max-width:420px;border-radius:10px;padding:20px;text-align:center}
        .pay-modal h3{margin-bottom:12px;font-size:20px}
        .pay-modal .price{font-size:24px;color:#f44336;margin:8px 0}
        .pay-modal .close{margin-top:16px;color:#666;font-size:17px;cursor:pointer}
        .goods-list{text-align:left;margin:10px 0;max-height:120px;overflow-y:auto;font-size:15px}
        .goods-item{padding:3px 0}

        /*收款码区域*/
        .qrcode-wrap{margin:14px 0}
        .qrcode-wrap img{width:220px;border-radius:8px}
    </style>
</head>
<body>
    <div class="header">
        <span class="back" id="backBtn">&lt;</span>
        <h1>伯亚</h1>
        <div class="domain">pfyd.cdbyrj.com</div>
    </div>

    <div class="title-box">
        <h2>欢迎</h2>
    </div>

    <div class="table-card">
        <div class="table-head">
            <div>商品</div>
            <div>价格</div>
        </div>

        <!--1.和成天下100元款，修正data-price与页面显示95保持一致-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="和成天下" data-price="95" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <img src=https://m.360buyimg.com/mobilecms/s750x750_jfs/t1/149194/14/14753/86780/5fb48f41Ef492b0b4/91fb90cc0130caf7.jpg!q80.dpg style="width:60px;height:60px;"/>
                <span>和成天下</span>
            </div>
            <div class="row-money">95</div>
        </div>

        <!--2.和成天下50元款-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="和成天下" data-price="45" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <img src=https://img14.360buyimg.com/n7/jfs/t1/111417/34/3089/110370/5ea5a826E83f2b8f4/7e4da9749215bdda.jpg style="width:60px;height:60px;"/>
                <span>和成天下</span>
            </div>
            <div class="row-money">45</div>
        </div>

        <!--3.缘为槟浪漫礼盒-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="缘为槟浪漫礼盒" data-price="40" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <img src=https://cbu01.alicdn.com/img/ibank/O1CN01hatWYe1Pvco1KY5qK_!!2219969341903-0-cib.310x310.jpg style="width:60px;height:60px;"/>
                <span>缘为槟浪漫礼盒</span>
            </div>
            <div class="row-money">40</div>
        </div>

        <!--4.和成天下30元款-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="和成天下" data-price="25" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <img src=https://img.alicdn.com/i2/3505025044/O1CN01yjNpcm1n8CYRc0pqM_!!3505025044.jpg style="width:60px;height:60px;"/>
                <span>和成天下</span>
            </div>
            <div class="row-money">25</div>
        </div>

        <!--5.口味王30元款-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="口味王" data-price="25" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <img src=https://img.alicdn.com/i2/613138686/O1CN01C5WjpS2E2EwCK9XJW_!!613138686.jpg style="width:60px;height:60px;"/>
                <span>口味王</span>
            </div>
            <div class="row-money">25</div>
        </div>

        <!--附加服务-->
        <div class="row-item">
            <input type="checkbox" name="payItem" data-name="附加服务" data-price="0" style="width:22px;height:22px;margin-right:12px;">
            <div class="row-text">
                <span>附加服务</span>
            </div>
            <div class="row-money">0</div>
        </div>
    </div>

    <div class="pay-way">
        <div class="pay-title">选择支付方式</div>
        <div class="wechat-row">
            <input type="radio" name="payType" value="wechat" checked style="width:22px;height:22px;margin-right:12px;">
            <span>微信</span>
        </div>
        <div class="wechat-row">
            <input type="radio" name="payType" value="alipay" style="width:22px;height:22px;margin-right:12px;">
            <span>支付宝</span>
        </div>
    </div>

    <div class="tip-text">
        由于不同银行卡单日支付限额不同，请注意缴费额度。
    </div>

    <!--底部固定合计栏-->
    <div class="total-bar">
        <div class="total-text">合计：<span class="total-price">¥0</span></div>
        <button id="payBtn">立即支付</button>
    </div>

    <!--支付弹窗-->
    <div class="mask" id="mask">
        <div class="pay-modal">
            <h3>确认支付</h3>
            <div class="goods-list" id="goodsList"></div>
            <div class="price">¥<span id="payPrice">0</span></div>
            <div id="payModeText">微信支付</div>
            <!--二维码显示区域-->
            <div class="qrcode-wrap" id="qrcodeWrap">
                <!--JS动态填入图片-->
            </div>
            <div class="close" id="closeModal">关闭</div>
        </div>
    </div>

<script>
const payBtn = document.getElementById('payBtn');
const mask = document.getElementById('mask');
const closeModal = document.getElementById('closeModal');
const goodsListEl = document.getElementById('goodsList');
const payPriceEl = document.getElementById('payPrice');
const payModeText = document.getElementById('payModeText');
const totalPriceDom = document.querySelector('.total-price');
const backBtn = document.getElementById('backBtn');
const qrcodeWrap = document.getElementById('qrcodeWrap');

const QR_IMG = {
    wechat:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZRl5qgbSVDSoc7pbLQQABkq7JWIEkbIEAAv0kAAJ2HBFUWxSG81QhSGc9BA.jpg",    
    alipay:"https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZRmFqgbTW8amw_gmOe5rNvW-Fg05D_gACASUAAnYcEVQWX3xy7yzdlj0E.jpg"  
}

// 返回按钮
backBtn.addEventListener('click',()=>{
    history.back();
})

//计算并更新底部总金额
function calcTotal(){
    const checkedItems = document.querySelectorAll('input[name="payItem"]:checked');
    let total = 0;
    checkedItems.forEach(cb=>{
        total += Number(cb.dataset.price)
    })
    totalPriceDom.innerText = `¥${total}`;
    return total;
}

// 打开支付弹窗，传入商品数组
function openPayModal(goodsList){
    let total = 0;
    let html = '';
    goodsList.forEach(item=>{
        total += Number(item.price);
        html += `<div class="goods-item">${item.name}  ¥${item.price}</div>`
    })
    goodsListEl.innerHTML = html;
    payPriceEl.innerText = total;

    // 获取选中的支付方式
    const payType = document.querySelector('input[name="payType"]:checked').value;
    payModeText.innerText = payType === 'wechat' ? '微信支付' : '支付宝支付';

    // 根据支付类型渲染对应收款码
    qrcodeWrap.innerHTML = `<img src="${QR_IMG[payType]}" alt="收款码">`;

    mask.style.display = 'flex';
}

payBtn.addEventListener('click',()=>{
    // 获取所有选中商品
    const checkedItems = document.querySelectorAll('input[name="payItem"]:checked');
    if(checkedItems.length === 0){
        alert('请选择至少一件商品');
        return;
    }
    const selectGoods = [];
    checkedItems.forEach(cb=>{
        selectGoods.push({
            name: cb.dataset.name,
            price: cb.dataset.price
        })
    })
    openPayModal(selectGoods);
})

//关闭弹窗
closeModal.addEventListener('click',()=>mask.style.display='none');
mask.addEventListener('click',e=>{
    if(e.target === mask) mask.style.display='none';
})

//点击行切换复选框（点击行任意位置勾选/取消）
document.querySelectorAll('.row-item').forEach(row=>{
    row.addEventListener('click',function(e){
        if(e.target.tagName === 'INPUT') return;
        const checkbox = this.querySelector('input[name="payItem"]');
        checkbox.checked = !checkbox.checked;
        calcTotal();
    })
})

//复选框手动勾选时更新总价
document.querySelectorAll('input[name="payItem"]').forEach(cb=>{
    cb.addEventListener('change',calcTotal)
})

calcTotal();
</script>
</body>
</html>
